<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simplest UI · Laravel Blade fixture</title>
  <!-- Equivalent to Blade's @vite(['resources/css/app.css', 'resources/js/app.js']). -->
  <link rel="stylesheet" href="./resources/css/app.css" />
  <script type="module" src="./resources/js/app.js"></script>
</head>
<body>
  <main>
    <button id="primary" class="ui-button ui-button--primary" type="button">Save changes</button>
    <article id="card" class="ui-card">
      <div class="ui-card__title">Card</div>
      <div class="ui-card__body">Laravel Vite pipeline.</div>
    </article>
    <sui-drawer id="drawer" label="Filters">
      <span slot="title">Filters</span>
      <p>Laravel fixture drawer.</p>
    </sui-drawer>
  </main>
</body>
</html>
