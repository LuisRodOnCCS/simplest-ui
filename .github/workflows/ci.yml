name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-sync:
    # Pull request events check out GitHub's merge preview, which already
    # contains `main`, so the invariant can only be verified on dev pushes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # `merge-base --is-ancestor` needs full history to be reliable.
          fetch-depth: 0
      - name: Ensure dev contains main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor origin/main HEAD

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:starters
      - run: npm run test:starter:package
      - run: npm run test:consumer
      - run: npm run docs:build
        env:
          VITE_DOCS_BASE: /simplest-ui/
      - run: npm pack --dry-run
      - run: npm pack --dry-run --workspace @luisrodonccs/create-simplest-ui

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npx playwright test --project=chromium --project=firefox --project=webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  packed-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:packed-matrix
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: packed-matrix-results
          path: test-results/
          retention-days: 7

  visual:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx playwright test --project=visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-report
          path: playwright-report/
          retention-days: 7
